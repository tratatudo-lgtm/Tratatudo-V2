<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="settings.page_title">Definições | TrataTudo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/i18n.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex selection:bg-indigo-500/30">

  <!-- Sidebar container -->
  <div id="sidebar-container" class="shrink-0"></div>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col min-h-screen overflow-x-hidden pb-12">
    
    <!-- Top Header -->
    <header id="header-container"></header>

    <!-- MAIN VIEWPORT -->
    <main id="main-content" class="flex-1 p-4 lg:p-8 max-w-7xl mx-auto w-full animate-fade-in space-y-6">
      
      <!-- Title -->
      <div>
        <h1 class="text-2xl font-black tracking-tight mb-1 text-white" data-i18n="settings.title">Configurações do Hub</h1>
        <p class="text-xs text-slate-400 font-medium" data-i18n="settings.subtitle">Gerencie os dados corporativos do seu tenant e as credenciais de envio de e-mails (SMTP).</p>
      </div>

      <!-- Alert Box -->
      <div id="settings-alert" class="hidden flex items-start gap-3 p-4 rounded-2xl text-xs font-semibold animate-fade-in border">
        <i id="alert-icon" data-lucide="alert-triangle" class="w-4 h-4 shrink-0"></i>
        <span id="alert-text">Mensagem decorrente da ação.</span>
      </div>

      <!-- Settings Layout -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- SECTION 1: DADOS DA EMPRESA -->
        <div class="bg-slate-900 border border-white/5 rounded-[2rem] p-6 lg:p-8 space-y-6">
          <div class="flex items-center gap-3 border-b border-white/5 pb-4">
            <div class="w-10 h-10 bg-indigo-500/10 text-indigo-400 rounded-xl flex items-center justify-center">
              <i data-lucide="building" class="w-5 h-5"></i>
            </div>
            <div>
              <h3 class="text-sm font-black text-white" data-i18n="settings.company_title">Dados da Empresa</h3>
              <p class="text-[10px] text-slate-500 uppercase font-black tracking-wider mt-0.5">Perfil Comercial do Tenant</p>
            </div>
          </div>

          <form id="profile-form" class="space-y-4">
            <div class="space-y-1.5">
              <label for="company-name" class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Nome da Empresa / Marca</label>
              <input type="text" id="company-name" required class="w-full bg-slate-950 border border-white/5 rounded-xl py-3 px-4 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500/50 transition-all text-slate-200">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="space-y-1.5">
                <label for="company-phone" class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Telefone Principal</label>
                <input type="text" id="company-phone" class="w-full bg-slate-950 border border-white/5 rounded-xl py-3 px-4 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500/50 transition-all text-slate-200 font-mono">
              </div>
              <div class="space-y-1.5">
                <label for="company-nif" class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Número de Contribuinte (NIF)</label>
                <input type="text" id="company-nif" class="w-full bg-slate-950 border border-white/5 rounded-xl py-3 px-4 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500/50 transition-all text-slate-200 font-mono">
              </div>
            </div>

            <div class="space-y-1.5">
              <label for="company-email" class="text-[9px] font-black uppercase text-slate-400 tracking-wider">E-mail de Contacto</label>
              <input type="email" id="company-email" class="w-full bg-slate-950 border border-white/5 rounded-xl py-3 px-4 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500/50 transition-all text-slate-200">
            </div>

            <div class="space-y-1.5">
              <label for="company-address" class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Morada Principal</label>
              <textarea id="company-address" rows="3" class="w-full bg-slate-950 border border-white/5 rounded-xl py-3 px-4 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500/50 transition-all text-slate-200 resize-none leading-relaxed"></textarea>
            </div>

            <button type="submit" id="btn-save-profile" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3.5 rounded-xl font-bold text-xs shadow-lg shadow-indigo-600/20 transition-all flex items-center justify-center gap-2 group">
              <span data-i18n="settings.save_profile">Atualizar Perfil</span>
              <i data-lucide="check" class="w-4 h-4"></i>
            </button>
          </form>
        </div>

        <!-- SECTION 2: CONFIGURAÇÃO SMTP -->
        <div class="bg-slate-900 border border-white/5 rounded-[2rem] p-6 lg:p-8 space-y-6">
          <div class="flex items-center gap-3 border-b border-white/5 pb-4">
            <div class="w-10 h-10 bg-indigo-500/10 text-indigo-400 rounded-xl flex items-center justify-center">
              <i data-lucide="mail" class="w-5 h-5"></i>
            </div>
            <div>
              <h3 class="text-sm font-black text-white" data-i18n="settings.smtp_title">Servidor SMTP E-mail</h3>
              <p class="text-[10px] text-slate-500 uppercase font-black tracking-wider mt-0.5">Credenciais de Envio de Webhooks</p>
            </div>
          </div>

          <form id="smtp-form" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="sm:col-span-2 space-y-1.5">
                <label for="smtp-host" class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Servidor de Envio (Host)</label>
                <input type="text" id="smtp-host" required placeholder="smtp.exemplo.com" class="w-full bg-slate-950 border border-white/5 rounded-xl py-3 px-4 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500/50 transition-all text-slate-200">
              </div>
              <div class="space-y-1.5">
                <label for="smtp-port" class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Porta</label>
                <input type="number" id="smtp-port" required placeholder="587" class="w-full bg-slate-950 border border-white/5 rounded-xl py-3 px-4 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500/50 transition-all text-slate-200 font-mono">
              </div>
            </div>

            <div class="space-y-1.5">
              <label for="smtp-email" class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Utilizador / E-mail</label>
              <input type="email" id="smtp-email" required placeholder="geral@exemplo.com" class="w-full bg-slate-950 border border-white/5 rounded-xl py-3 px-4 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500/50 transition-all text-slate-200">
            </div>

            <div class="space-y-1.5">
              <label for="smtp-password" class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Palavra-passe (Password)</label>
              <input type="password" id="smtp-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-white/5 rounded-xl py-3 px-4 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500/50 transition-all text-slate-200 font-mono">
            </div>

            <div class="space-y-1.5">
              <label for="smtp-security" class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Segurança / Protocolo</label>
              <select id="smtp-security" class="w-full bg-slate-950 border border-white/5 rounded-xl py-3 px-4 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500/50 transition-all text-slate-300">
                <option value="tls">STARTTLS (Recomendado)</option>
                <option value="ssl">SSL / TLS</option>
                <option value="none">Sem encriptação</option>
              </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
              <button type="button" id="btn-test-smtp" class="w-full bg-white/5 hover:bg-white/10 text-slate-300 py-3.5 rounded-xl font-bold text-xs border border-white/5 transition-all flex items-center justify-center gap-2">
                <span data-i18n="settings.test_smtp">Testar Ligação</span>
                <i data-lucide="activity" class="w-4 h-4"></i>
              </button>
              <button type="submit" id="btn-save-smtp" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3.5 rounded-xl font-bold text-xs shadow-lg shadow-indigo-600/20 transition-all flex items-center justify-center gap-2">
                <span data-i18n="settings.save_smtp">Salvar SMTP</span>
                <i data-lucide="save" class="w-4 h-4"></i>
              </button>
            </div>
          </form>
        </div>

      </div>

    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
