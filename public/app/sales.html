<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendas | TrataTudo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex selection:bg-indigo-500/30">
  <div id="sidebar-container" class="shrink-0"></div>
  <div class="flex-1 flex flex-col min-h-screen overflow-x-hidden">
    <header id="header-container"></header>
    <main class="flex-1 p-4 lg:p-8 max-w-7xl mx-auto w-full animate-fade-in space-y-6">
      <div>
        <h1 class="text-2xl font-black text-white">Análise de Vendas</h1>
        <p class="text-xs text-slate-400 font-medium">Fluxo financeiro, novos contratos e volume de negócios MRR.</p>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-slate-900 border border-white/5 rounded-2xl p-5">
          <span class="text-[9px] font-black uppercase text-slate-500 tracking-wider">MRR Atual</span>
          <h3 class="text-2xl font-black text-indigo-400 mt-2">1,240.00€</h3>
          <p class="text-[9px] text-slate-500 font-bold mt-1">SaaS de recorrência ativa</p>
        </div>
        <div class="bg-slate-900 border border-white/5 rounded-2xl p-5">
          <span class="text-[9px] font-black uppercase text-slate-500 tracking-wider">LTV Médio</span>
          <h3 class="text-2xl font-black text-emerald-400 mt-2">680.00€</h3>
          <p class="text-[9px] text-slate-500 font-bold mt-1">Por empresa/tenant</p>
        </div>
        <div class="bg-slate-900 border border-white/5 rounded-2xl p-5">
          <span class="text-[9px] font-black uppercase text-slate-500 tracking-wider">Churn Rate</span>
          <h3 class="text-2xl font-black text-rose-500 mt-2">1.8%</h3>
          <p class="text-[9px] text-slate-500 font-bold mt-1">Rácio de desistências mensal</p>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
</body>
</html>
