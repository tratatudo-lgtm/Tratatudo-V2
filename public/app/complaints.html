<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reclamações | TrataTudo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex selection:bg-indigo-500/30">
  <div id="sidebar-container" class="shrink-0"></div>
  <div class="flex-1 flex flex-col min-h-screen overflow-x-hidden">
    <header id="header-container"></header>
    <main class="flex-1 p-4 lg:p-8 max-w-7xl mx-auto w-full animate-fade-in space-y-6">
      <div>
        <h1 class="text-2xl font-black text-white">Reclamações e Arbitragens</h1>
        <p class="text-xs text-slate-400 font-medium">Controlo de litígios operacionais, falhas críticas de IA ou queixas de integridade.</p>
      </div>
      <div class="bg-slate-900 border border-white/5 rounded-3xl p-8 text-center space-y-3">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 mx-auto">
          <i data-lucide="check-circle" class="w-6 h-6"></i>
        </div>
        <h3 class="text-sm font-black text-white uppercase tracking-wider">Tudo em conformidade!</h3>
        <p class="text-xs text-slate-500 max-w-sm mx-auto">Não temos histórico de litígios ativos ou reclamações em aberto nesta plataforma.</p>
      </div>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
</body>
</html>
