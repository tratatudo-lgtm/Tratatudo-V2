<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickets | TrataTudo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex selection:bg-indigo-500/30">

  <!-- Sidebar Container -->
  <div id="sidebar-container" class="shrink-0"></div>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col min-h-screen overflow-x-hidden pb-12">
    <!-- Header Container -->
    <header id="header-container"></header>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 lg:p-8 max-w-7xl mx-auto w-full animate-fade-in space-y-6">
      
      <!-- Heading -->
      <div>
        <h1 class="text-2xl font-black tracking-tight mb-1 text-white">Tickets de Suporte</h1>
        <p class="text-xs text-slate-400 font-medium">Atendimento prioritário a bugs, ajuda com setup AI ou renovações.</p>
      </div>

      <!-- Tickets Grid Layout -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Tickets List Column (Left) -->
        <div class="lg:col-span-1 space-y-4">
          <div class="bg-slate-900 border border-white/5 rounded-2xl p-4 flex items-center justify-between">
            <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest">Caixa de Entrada</h3>
            <span id="ticket-total-badge" class="px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-bold text-[10px]">0</span>
          </div>

          <!-- Loading Spinner -->
          <div id="tickets-loading" class="flex flex-col items-center justify-center p-12 bg-slate-900/50 rounded-2xl border border-white/5">
            <i data-lucide="loader" class="w-6 h-6 text-indigo-500 animate-spin"></i>
          </div>

          <!-- Injected List -->
          <div id="tickets-list" class="space-y-3 max-h-[70vh] overflow-y-auto no-scrollbar hidden">
            <!-- Dynamic items call -->
          </div>

          <!-- Empty list -->
          <div id="tickets-empty" class="hidden text-center py-10 bg-slate-900/30 border border-white/5 rounded-2xl">
            <i data-lucide="ticket-check" class="w-8 h-8 text-slate-600 mx-auto mb-2"></i>
            <p class="text-xs text-slate-500 font-bold">Sem tickets pendentes!</p>
          </div>
        </div>

        <!-- Selected Ticket Chat/Details View (Right) -->
        <div class="lg:col-span-2 flex flex-col bg-slate-900 border border-white/5 rounded-3xl h-[70vh] relative overflow-hidden">
          
          <!-- Default placeholder -->
          <div id="chat-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-center p-8 z-10 bg-slate-900">
            <div class="w-16 h-16 bg-white/5 border border-white/5 rounded-2xl text-slate-500 flex items-center justify-center mb-4">
              <i data-lucide="message-square" class="w-8 h-8"></i>
            </div>
            <h3 class="text-md font-bold text-slate-300">Nenhum ticket selecionado</h3>
            <p class="text-xs text-slate-500 max-w-xs mt-1">Selecione um suporte ativo na lista à esquerda para interagir em tempo-real.</p>
          </div>

          <!-- Active Conversation -->
          <div id="chat-box" class="hidden flex flex-col h-full relative">
            <!-- Header chat info -->
            <div class="p-4 border-b border-white/5 flex items-center justify-between bg-slate-950/20 shrink-0">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center">
                  <i data-lucide="user-check" class="w-5 h-5"></i>
                </div>
                <div>
                  <h4 id="chat-client-name" class="text-xs font-black text-white leading-none">--</h4>
                  <span id="chat-ticket-title" class="text-[10px] text-slate-500 font-bold mt-1 inline-block">--</span>
                </div>
              </div>

              <!-- Status Action controls -->
              <div class="flex items-center gap-2">
                <span id="chat-ticket-status" class="px-2.5 py-1 text-[9px] font-black uppercase tracking-wider rounded-full border">--</span>
                <button 
                  id="btn-resolve-ticket"
                  class="bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl px-3.5 py-2 font-bold text-[10px] transition-colors"
                >
                  RESOLVER
                </button>
              </div>
            </div>

            <!-- Scrollable message timeline -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 no-scrollbar bg-slate-950/20">
              <!-- Dynamically populated messages timeline -->
            </div>

            <!-- Footer Message formulation fields -->
            <form id="chat-send-form" class="p-4 border-t border-white/5 bg-slate-950/10 flex items-center gap-2 shrink-0">
              <input 
                type="text" 
                id="chat-input" 
                required 
                placeholder="Introduza a resposta de suporte..."
                class="flex-1 bg-white/5 border border-white/10 rounded-xl p-3.5 text-xs focus:ring-2 focus:ring-indigo-500/20 focus:outline-none focus:border-indigo-500/50 transition-all font-semibold"
              >
              <button 
                type="submit"
                class="bg-indigo-600 hover:bg-indigo-500 text-white p-3.5 rounded-xl flex items-center justify-center"
              >
                <i data-lucide="send" class="w-4 h-4"></i>
              </button>
            </form>
          </div>

        </div>

      </div>

    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/tickets.js"></script>
</body>
</html>
